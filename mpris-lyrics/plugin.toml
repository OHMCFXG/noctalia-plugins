# MPRIS Lyrics — bar-synced lyrics for the active media player.
# Logic lives in a headless [[service]]; the bar [[widget]] is a thin client
# over noctalia.state. Track metadata and position come from Noctalia's own
# D-Bus control plane (dev.noctalia.Mpris), not a reimplemented MPRIS client.
#
# Settings scopes:
# - [[setting]]        plugin-level → Settings → Plugins gear
#                      (shared: player filter, sources, timing — service reads these)
# - [[widget.setting]] instance-level → middle-click the bar widget
#                      (presentation only — width, secondary line look)

id           = "0x1ce/mpris-lyrics"
name         = "MPRIS Lyrics"
version      = "1.2.1"
plugin_api   = 3
author       = "0x1ce"
license      = "MIT"
icon         = "music"
description  = "Synced lyrics on the bar from NetEase, QQ Music, or LRCLib."
tags         = ["bar", "service", "media", "music"]
dependencies = ["busctl", "openssl"]

# ── Plugin-level: data / fetch / timing (shared by service + all instances) ──

[[setting]]
key = "playerFilterMode"
type = "select"
label_key = "settings.player_filter_mode.label"
description_key = "settings.player_filter_mode.description"
default = "blacklist"
options = [
  { value = "off", label_key = "settings.player_filter_mode.options.off" },
  { value = "blacklist", label_key = "settings.player_filter_mode.options.blacklist" },
  { value = "whitelist", label_key = "settings.player_filter_mode.options.whitelist" },
]

[[setting]]
key = "playerFilterList"
type = "string_list"
label_key = "settings.player_filter_list.label"
description_key = "settings.player_filter_list.description"
default = ["firefox", "chrome", "zen"]

[[setting]]
key = "primaryLyricsSource"
type = "select"
label_key = "settings.primary_source.label"
description_key = "settings.primary_source.description"
default = "netease"
options = [
  { value = "netease", label_key = "settings.primary_source.options.netease" },
  { value = "qqmusic", label_key = "settings.primary_source.options.qqmusic" },
  { value = "lrclib", label_key = "settings.primary_source.options.lrclib" },
]

[[setting]]
key = "preferPlayerLyrics"
type = "bool"
label_key = "settings.prefer_player_lyrics.label"
description_key = "settings.prefer_player_lyrics.description"
default = false

[[setting]]
key = "requestTimeoutMs"
type = "int"
label_key = "settings.timeout.label"
description_key = "settings.timeout.description"
default = 5000
min = 1000
max = 12000
advanced = true

[[setting]]
key = "lyricAdvanceMs"
type = "int"
label_key = "settings.advance.label"
description_key = "settings.advance.description"
default = 0
min = -1500
max = 1500

# ── Entries ──────────────────────────────────────────────────────────────────

[[service]]
id = "lyrics"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "widget.luau"

  # ── Instance presentation (per bar placement) ────────────────────────────

  [[widget.setting]]
  key = "barMaxWidth"
  type = "int"
  label_key = "settings.bar_width.label"
  description_key = "settings.bar_width.description"
  default = 180
  min = 60
  max = 640

  [[widget.setting]]
  key = "barWidthMode"
  type = "select"
  label_key = "settings.bar_width_mode.label"
  description_key = "settings.bar_width_mode.description"
  default = "adaptive"
  options = [
    { value = "adaptive", label_key = "settings.bar_width_mode.options.adaptive" },
    { value = "fixed", label_key = "settings.bar_width_mode.options.fixed" },
  ]

  [[widget.setting]]
  key = "textAlign"
  type = "select"
  label_key = "settings.text_align.label"
  description_key = "settings.text_align.description"
  default = "center"
  options = [
    { value = "left", label_key = "settings.text_align.options.left" },
    { value = "center", label_key = "settings.text_align.options.center" },
    { value = "right", label_key = "settings.text_align.options.right" },
  ]

  [[widget.setting]]
  key = "barHideWhenIdle"
  type = "bool"
  label_key = "settings.bar_hide.label"
  description_key = "settings.bar_hide.description"
  default = true

  [[widget.setting]]
  key = "showBarStatusDot"
  type = "bool"
  label_key = "settings.bar_dot.label"
  description_key = "settings.bar_dot.description"
  default = true

  [[widget.setting]]
  key = "paddingLeft"
  type = "int"
  label_key = "settings.padding_left.label"
  description_key = "settings.padding_left.description"
  default = 3
  min = 0
  max = 32

  [[widget.setting]]
  key = "paddingRight"
  type = "int"
  label_key = "settings.padding_right.label"
  description_key = "settings.padding_right.description"
  default = 3
  min = 0
  max = 32

  [[widget.setting]]
  key = "showSecondaryLine"
  type = "bool"
  label_key = "settings.show_secondary_line.label"
  description_key = "settings.show_secondary_line.description"
  default = false

  [[widget.setting]]
  key = "secondaryLineContent"
  type = "select"
  label_key = "settings.secondary_line_content.label"
  description_key = "settings.secondary_line_content.description"
  default = "translation"
  visible_when = { key = "showSecondaryLine", values = ["true"] }
  options = [
    { value = "translation", label_key = "settings.secondary_line_content.options.translation" },
    { value = "romanization", label_key = "settings.secondary_line_content.options.romanization" },
  ]

  [[widget.setting]]
  key = "secondaryPrimaryFontSize"
  type = "int"
  label_key = "settings.secondary_primary_font_size.label"
  description_key = "settings.secondary_primary_font_size.description"
  default = 12
  min = 8
  max = 20
  advanced = true
  visible_when = { key = "showSecondaryLine", values = ["true"] }

  [[widget.setting]]
  key = "secondaryFontSize"
  type = "int"
  label_key = "settings.secondary_font_size.label"
  description_key = "settings.secondary_font_size.description"
  default = 10
  min = 7
  max = 16
  advanced = true
  visible_when = { key = "showSecondaryLine", values = ["true"] }

  [[widget.setting]]
  key = "secondaryLineGap"
  type = "int"
  label_key = "settings.secondary_line_gap.label"
  description_key = "settings.secondary_line_gap.description"
  default = -4
  min = -12
  max = 8
  advanced = true
  visible_when = { key = "showSecondaryLine", values = ["true"] }

  [[widget.setting]]
  key = "secondaryOpacity"
  type = "int"
  label_key = "settings.secondary_opacity.label"
  description_key = "settings.secondary_opacity.description"
  default = 70
  min = 30
  max = 100
  advanced = true
  visible_when = { key = "showSecondaryLine", values = ["true"] }
